name: .NET Unit Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            project: Hoi4BlueprintBuilder.Windows/Hoi4BlueprintBuilder.Windows.csproj
          - os: ubuntu-latest
            project: Hoi4BlueprintBuilder.Linux/Hoi4BlueprintBuilder.Linux.csproj
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v6
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Build ${{ matrix.project }}
      env:
        SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
      run: dotnet build ${{ matrix.project }} --configuration Release
    - name: Test
      env:
        SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
      run: dotnet test --project Hoi4BlueprintBuilder.UnitTests/Hoi4BlueprintBuilder.UnitTests.csproj
