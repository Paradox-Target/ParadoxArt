name: "Feature Request / 功能建议"
description: "Suggest a feature or improvement. / 提交功能建议。"
title: "[Feature]: "
body:
  - type: checkboxes
    id: checks
    attributes:
      label: "Checklist / 前置检查"
      options:
        - label: "I have searched existing feature requests. / 我已搜索现有功能建议。"
          required: true
        - label: "This suggestion is practical. / 此建议切实可行。"
          required: true
  - type: textarea
    id: content
    attributes:
      label: "Suggestion Details / 建议说明"
    validations:
      required: true
