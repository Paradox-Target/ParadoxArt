name: "Question / 疑问"
description: "Ask a question. / 提出疑问。"
title: "[Question]: "
labels: ["help wanted"]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: "Checklist / 前置检查"
      options:
        - label: "I have searched existing questions but couldn't find an answer. / 我已搜索现有疑问但未能找到答案。"
          required: true
  - type: textarea
    id: content
    attributes:
      label: "Question Details / 疑问说明"
    validations:
      required: true
