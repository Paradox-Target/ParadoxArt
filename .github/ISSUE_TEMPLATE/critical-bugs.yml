name: "Critical Bug / 严重问题"
description: "Report a critical bug. / 报告严重问题。"
title: "[Critical Bug]: "
labels: ["bug"]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: "Checklist / 前置检查"
      options:
        - label: "I have searched existing issues, but I could not find a similar issue nor have my issues been resolved. / 我已搜索现有问题，但并未找到相关内容且我的问题仍未解决。"
          required: true
        - label: "I acknowledge and agree that attachments may contain personal information. / 我知晓并同意附件可能包含个人信息。"
          required: true
        - label: "This bug prevents normal use, or causes data loss, software/hardware failure. / 此问题已导致软件无法正常使用或已造成数据丢失、软硬件故障。"
          required: true
  - type: textarea
    id: bug-details
    attributes:
      label: "Bug Details / 问题说明"
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: "Steps to Reproduce / 复现方式"
    validations:
      required: false
  - type: upload
    id: attachment
    attributes:
      label: "Attachments / 附件"
    validations:
      required: true
